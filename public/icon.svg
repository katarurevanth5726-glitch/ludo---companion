<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A2342"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </radialGradient>
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="diceFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="pipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>

  <!-- Four Classic Ludo Quadrant Corner Markers -->
  <!-- Top-Left Green -->
  <circle cx="100" cy="100" r="32" fill="#10B981" filter="url(#pipGlow)"/>
  <circle cx="100" cy="100" r="16" fill="#A7F3D0"/>

  <!-- Top-Right Red -->
  <circle cx="412" cy="100" r="32" fill="#EF4444" filter="url(#pipGlow)"/>
  <circle cx="412" cy="100" r="16" fill="#FECACA"/>

  <!-- Bottom-Left Blue -->
  <circle cx="100" cy="412" r="32" fill="#3B82F6" filter="url(#pipGlow)"/>
  <circle cx="100" cy="412" r="16" fill="#BFDBFE"/>

  <!-- Bottom-Right Yellow -->
  <circle cx="412" cy="412" r="32" fill="#EAB308" filter="url(#pipGlow)"/>
  <circle cx="412" cy="412" r="16" fill="#FEF08A"/>

  <!-- Center 3D Dice Shell -->
  <rect x="146" y="146" width="220" height="220" rx="44" fill="url(#diceFace)" stroke="url(#purpleBorder)" stroke-width="8"/>

  <!-- Top highlight inner reflection -->
  <path d="M 158 170 Q 256 160 354 170" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-linecap="round"/>

  <!-- Six Golden Dice Pips (2 columns of 3) -->
  <!-- Column 1 -->
  <circle cx="206" cy="196" r="16" fill="#FDE047" filter="url(#pipGlow)"/>
  <circle cx="206" cy="256" r="16" fill="#FDE047" filter="url(#pipGlow)"/>
  <circle cx="206" cy="316" r="16" fill="#FDE047" filter="url(#pipGlow)"/>

  <!-- Column 2 -->
  <circle cx="306" cy="196" r="16" fill="#FDE047" filter="url(#pipGlow)"/>
  <circle cx="306" cy="256" r="16" fill="#FDE047" filter="url(#pipGlow)"/>
  <circle cx="306" cy="316" r="16" fill="#FDE047" filter="url(#pipGlow)"/>
</svg>
